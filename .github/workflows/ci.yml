name: CI

# The Rust crate lives at app/CoperativeAI/src-tauri and the frontend at
# app/CoperativeAI — there is no Cargo.toml at the repository root, so every
# cargo step names its manifest explicitly.
#
# Windows runners, because this is a Windows desktop app and the first run on
# ubuntu proved the difference is not cosmetic: tauri-build wants an icon.png
# that does not exist (the bundle is configured for icon.ico, which is the
# right answer on Windows), and `npm ci` refuses a lockfile resolved on win32
# because rollup ships a platform-specific native binary. Testing a platform
# nobody ships would have meant carrying fixes for it forever.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # **No version here on purpose.** rust-toolchain.toml at the repository
      # root says which Rust this builds with, and rustup honours it — so the
      # laptop and the runner cannot drift, which is exactly what they did.
      # This step exists to install it up front and print it, rather than have
      # it appear silently inside whichever cargo command runs first.
      - name: Rust (version from rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/CoperativeAI/src-tauri

      # The codebase is warning-free; -D warnings is what keeps it that way.
      # Three lints accumulated unnoticed before this gate existed.
      - name: Clippy (warnings are failures)
        run: cargo clippy --manifest-path app/CoperativeAI/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path app/CoperativeAI/src-tauri/Cargo.toml

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/CoperativeAI
    steps:
      - uses: actions/checkout@v5

      # Pinned to the major, not `lts/*`: tracking the LTS alias would move this
      # build to Node 26 the day that line goes LTS, with no commit and nobody
      # deciding. A number here means the bump is a change somebody made, and
      # `.nvmrc` carries the same one so a laptop and the runner agree.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/CoperativeAI/package-lock.json

      - run: npm ci

      # tsc type-checks the test files too, so an unused import in a *.test.tsx
      # fails the build even when vitest is green. Run it in its own right.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # Monaco's workers need the larger heap the build script already sets.
      - name: Build
        run: npm run build
