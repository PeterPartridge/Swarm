name: Release

# Builds the Windows desktop app and publishes it, with the version worked out
# here rather than typed into three files by hand.
#
# **Every commit to main releases.** This used to be tag-driven, on the argument
# that a version which moves when nobody decided it should is noise. The call
# since is that always having an installer for what is on main is worth more
# than a tidy release list, so main is the trigger and the number is counted
# here. The cost, so it is not a surprise later: a README-only commit gets a
# release like any other, and the list grows at the rate the branch does.
#
# **A tag is still made**, from the version this works out — the release action
# creates it against the commit being built. A release with no tag leaves
# nothing in the repository pointing back at the code that produced it.
#
# **The version lives in three places** — package.json, tauri.conf.json and
# Cargo.toml — and they have to agree or the installer, the About box and the
# crate all claim something different. They are stamped at build time rather
# than committed, so there is one source of truth and no way to release v0.3.0
# and ship an installer that says 0.1.0.

on:
  push:
    branches:
      - main
  # So a build can be tried without cutting a release. Nothing is published on
  # this path — see the `if` on the release step.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp for a trial build, e.g. 0.3.0"
        required: false
        default: "0.0.0"

env:
  CARGO_TERM_COLOR: always

permissions:
  # Only what creating a release needs. The default token is read-only for
  # contents in repositories configured that way, and a release cannot be
  # written without this.
  contents: write

# **One release build at a time.** Two commits landing seconds apart each
# counted the same highest tag, both decided they were 0.2.4, and both published
# to it — the second silently overwrote the first's installers and both runs
# reported success. Serialising the workflow means the second run reads the tags
# after the first has pushed one, so it counts 0.2.5 rather than colliding.
#
# cancel-in-progress is false because the whole point is that the queued run
# still happens; cancelling it would drop a commit's release entirely.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The version is counted from the existing tags, and the default
          # shallow clone fetches none of them.
          fetch-depth: 0

      # **The last release plus one.** Tags carry a leading `v` and the three
      # files do not; Cargo and Tauri both reject `v0.3.0`, and finding that out
      # from a failed release build would be a poor way to learn it.
      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            # Compared as version numbers rather than as text — sorted as text,
            # v0.2.9 outranks v0.2.10 and the next release would go backwards.
            $tags = @(
              git tag --list 'v*' |
                ForEach-Object { $_ -replace '^v', '' } |
                Where-Object { $_ -match '^\d+\.\d+\.\d+$' } |
                ForEach-Object { [version] $_ } |
                Sort-Object
            )
            if ($tags.Count -eq 0) {
              $version = '0.1.0'
            } else {
              $last = $tags[-1]
              $version = '{0}.{1}.{2}' -f $last.Major, $last.Minor, ($last.Build + 1)
            }
          }
          # Tauri and Cargo both want major.minor.patch. A version that is not
          # that shape fails here, loudly, rather than producing an installer
          # that will not install.
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$version' is not major.minor.patch."
          }
          # Belt and braces behind the concurrency group. If this version is
          # already tagged then something raced anyway, and publishing would
          # overwrite installers that are already released — which is exactly
          # what happened at 0.2.4, with both runs reporting success. Fail here
          # instead, where it is visible.
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $clash = git tag --list "v$version"
            if ($clash) {
              throw "v$version is already tagged. Refusing to overwrite a published release."
            }
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Building $version"

      - name: Stamp the version into all three files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Each file is read, checked to contain the field, and rewritten.
          # A silent no-op here would ship an installer with the old number,
          # which is the one failure this whole step exists to prevent.
          $pkg = 'app/CoperativeAI/package.json'
          $tau = 'app/CoperativeAI/src-tauri/tauri.conf.json'
          $car = 'app/CoperativeAI/src-tauri/Cargo.toml'

          # [regex]::Replace rather than the -replace operator throughout: only
          # the .NET call takes a count, and "just the first one" is the whole
          # point — a dependency's own version must never be the one rewritten.
          foreach ($f in @($pkg, $tau)) {
            $text = Get-Content $f -Raw
            $next = [regex]::Replace($text, '("version"\s*:\s*)"[^"]*"', ('$1"' + $env:VERSION + '"'), 1)
            if ($next -eq $text) { throw "No version field replaced in $f" }
            Set-Content $f $next -NoNewline -Encoding utf8
          }

          $text = Get-Content $car -Raw
          # Anchored to the start of a line so a dependency's own `version =`
          # is never the one that gets rewritten.
          $next = [regex]::Replace($text, '(?m)^version\s*=\s*"[^"]*"', ('version = "' + $env:VERSION + '"'), 1)
          if ($next -eq $text) { throw "No version field replaced in $car" }
          Set-Content $car $next -NoNewline -Encoding utf8

          Write-Host "--- stamped ---"
          Select-String -Path $pkg, $tau -Pattern '"version"' | Select-Object -First 2
          Select-String -Path $car -Pattern '^version' | Select-Object -First 1

      # **No version here on purpose.** rust-toolchain.toml at the repository
      # root says which Rust this builds with, and rustup honours it — so the
      # laptop and the runner cannot drift, which is exactly what they did.
      # This step exists to install it up front and print it, rather than have
      # it appear silently inside whichever cargo command runs first.
      - name: Rust (version from rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/CoperativeAI/src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/CoperativeAI/package-lock.json

      - name: Install
        working-directory: app/CoperativeAI
        run: npm ci

      # **The same gates as CI, before anything is published.** A release build
      # that skipped them could ship code that main would have rejected — and
      # the tag is usually cut from main without a second look.
      - name: Clippy (warnings are failures)
        run: cargo clippy --manifest-path app/CoperativeAI/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path app/CoperativeAI/src-tauri/Cargo.toml

      - name: Typecheck
        working-directory: app/CoperativeAI
        run: npx tsc --noEmit

      - name: Frontend tests
        working-directory: app/CoperativeAI
        run: npm test

      # Builds the frontend and bundles it into an installer. The bundle is
      # configured for `.ico`, which is why this only runs on Windows — see the
      # note at the top of ci.yml.
      - name: Build the desktop app
        working-directory: app/CoperativeAI
        run: npx tauri build

      # Each expected asset is looked for by itself, so "two of the three
      # arrived" is a failure rather than a green tick — which is how the
      # portable binary went missing from the first real run.
      - name: Collect what was built
        id: collect
        shell: pwsh
        run: |
          $root = 'app/CoperativeAI/src-tauri/target/release'
          $out = 'dist-release'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # Verified against a real `tauri build`, both locally and on a runner:
          #   bundle/msi/CoperativeAI_<version>_x64_en-US.msi   ~17 MB
          #   bundle/nsis/CoperativeAI_<version>_x64-setup.exe  ~13 MB
          #   <the binary>.exe                                  ~45 MB, portable
          #
          # **The portable binary is globbed, not named.** Cargo names it after
          # the crate and Tauri after the product, and the two differ here —
          # naming either one got it silently missed on the first real run. Only
          # the bundles live in subdirectories, so a top-level `*.exe` can only
          # be the binary.
          #
          # The installers carry the version in their filename, so a release
          # stamped with the wrong number is visible in the asset list rather
          # than only inside the installer.
          $patterns = @(
            @{ what = 'msi installer';   glob = "$root/bundle/msi/*.msi" },
            @{ what = 'nsis installer';  glob = "$root/bundle/nsis/*.exe" },
            @{ what = 'portable binary'; glob = "$root/*.exe" }
          )

          # **Every pattern reports.** The first version of this only complained
          # when *nothing* matched, so two assets out of three looked like a
          # clean run — which is how the portable binary went missing without
          # anybody being told.
          $found = @()
          $missing = @()
          foreach ($p in $patterns) {
            $hit = @(Get-ChildItem $p.glob -File -ErrorAction SilentlyContinue)
            if ($hit.Count -eq 0) {
              $missing += $p.what
              Write-Host "MISSING  $($p.what)  ($($p.glob))"
            } else {
              $found += $hit
              $hit | ForEach-Object { Write-Host "found    $($p.what)  $($_.Name)" }
            }
          }

          if ($missing.Count -gt 0) {
            Write-Host "--- what is actually in $root ---"
            Get-ChildItem $root -Recurse -Depth 2 -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -in '.exe', '.msi' } |
              ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "Did not find: $($missing -join ', '). Nothing is published from a partial build."
          }

          $found | ForEach-Object { Copy-Item $_.FullName $out }
          Get-ChildItem $out | ForEach-Object { Write-Host "publishing $($_.Name)" }

      # **v7, not v4.** v4 runs on Node 20, which the runners have deprecated
      # and are currently force-running on Node 24 — it works until the shim is
      # withdrawn, and then it does not. v5, v6 and v7 are each runtime moves
      # rather than interface changes; the only new input is `archive`, and the
      # two used here are unchanged. v7 wants runner 2.327.1 or later, which
      # windows-latest is.
      - uses: actions/upload-artifact@v7
        with:
          name: CoperativeAI-${{ steps.version.outputs.version }}-windows
          path: dist-release/*

      # **Only a push to main publishes.** A manual run builds and leaves the
      # result as an artifact, so the pipeline can be tried without a release
      # appearing — which is how the missing portable binary was caught.
      #
      # The tag does not exist yet; the action creates it against this commit.
      # That is also what stops this from looping: a tag push does not match the
      # branch trigger above, so publishing cannot start another run.
      - name: Publish the release
        if: github.event_name == 'push'
        # v3 is the same action on Node 24 — the release notes describe it as a
        # runtime move and nothing else. Every input below is unchanged from v2.
        uses: softprops/action-gh-release@v3
        with:
          name: CoperativeAI ${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist-release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
