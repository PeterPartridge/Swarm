[package]
name = "coperativeai"
version = "0.1.0"
edition = "2021"

[dependencies]
# Images travel to vision models as base64 — see ai/vision.rs.
base64 = "0.22"
keyring = { version = "3", features = ["windows-native", "sync-secret-service"] }
portable-pty = "0.9.0"
reqwest = { version = "0.12", features = ["json"] }
# The MCP server, and the transport it is actually reachable over.
# streamable-http rather than stdio: a client cannot spawn this server, because
# the data lives in a turso database the running app already holds — a spawned
# child would fail to open it or fight the app for it. See mcp/serve.rs.
rmcp = { version = "3.1.1", features = ["server", "transport-streamable-http-server"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# A policy is somebody else's root script; its digest is how it is recognised
# again. Already compiled for tauri's own codegen, so this costs no new
# supply chain — see tooling/sandbox_policy.rs.
sha2 = "0.10"
# The MCP server's bearer token has to be the operating system's randomness on
# both Windows and Linux. Already in the tree, so this costs nothing new — and
# the alternative, reading /dev/urandom directly, is a panic on the primary
# platform. See mcp/decide.rs.
getrandom = "0.3"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
turso = "0.6.1"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
